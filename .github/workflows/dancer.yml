# Cloud Dancer: gets every request an owner makes, sorts it, and does the fabric herself.
# Flow (a news item, a post, a catalogue entry) she hands to Flo. Fabric (layout, menus, pages, design,
# standing wording) she makes on a new branch and a private preview copy, and the owner is emailed the
# preview address to publish or send back. She never publishes. Read dancer/DANCER.md and dancer/fabric.js.
#
# Started by the Cloud Dancer Worker the moment an owner asks for something (a "dancer-wake" dispatch, through
# the door in the site Worker), or by hand from the Actions tab. If there is no work, it stops before Claude
# starts, so no tokens are used.
#
# Cloud Dancer proves who she is to her API with this run's GitHub identity token ("id-token: write"): no secret.
# Secrets it shares with Phix (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  for Claude, from the owner's Claude subscription
#   PHIX_GITHUB_TOKEN        pushes branches and opens pull requests on the site repos. Cloud Dancer never
#                            merges: the owner's "publish" does.
#   CLOUDFLARE_API_TOKEN     to upload preview copies (Workers Scripts: Edit)
#   CLOUDFLARE_ACCOUNT_ID

name: Cloud Dancer

on:
  repository_dispatch:
    types: [dancer-wake]
  workflow_dispatch:

concurrency:
  group: dancer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  dancer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claim the work
        id: claim
        run: |
          node dancer/api.mjs claim > dancer-work.json
          cat dancer-work.json
          echo "n=$(jq '.work | length' dancer-work.json)" >> "$GITHUB_OUTPUT"

      - name: Commit as Carrados
        if: steps.claim.outputs.n != '0'
        run: |
          git config --global user.name "Carrados"
          git config --global user.email "200772005+Carrados@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        if: steps.claim.outputs.n != '0'
        env:
          GH_TOKEN: ${{ secrets.PHIX_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PHIX_GITHUB_TOKEN }}
          bot_name: Carrados
          bot_id: "200772005"
          display_report: "true"
          prompt: |
            Read dancer/DANCER.md in this repository and follow it. Your work is in dancer-work.json.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node dancer/api.mjs:*),Bash(curl:*),Bash(git:*),Bash(gh:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(diff:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(pwd),Bash(jq:*),Bash(echo:*),Bash(sleep:*),Bash(date:*)"
