# Flo (Florence): Cloud Dancer's flow agent. Puts news items, posts and catalogue entries live on the
# owner's sites, in the shape each site's FLOW.md sets out; says so when a request is design work instead.
# Read flo/FLO.md and dancer/flo.js.
#
# Started by Cloud Dancer the moment an owner asks for something (a "flo-wake" dispatch, through the door in
# the site Worker), or by hand from the Actions tab. If there is no work, it stops before Claude starts, so no
# tokens are used.
#
# Flo proves who she is to Cloud Dancer with this run's GitHub identity token ("id-token: write"): no secret.
# Secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  for Claude, from the owner's Claude subscription
#
# Flow is off on every site for now (`flow` in dancer/sites.js), and the Worker refuses to merge anything she
# hands in while it is. She holds no token that can push or merge: only this run's own read-only token. Before
# flow is turned on for a site, give her run the same shape as Cloud Dancer's (an agent job with no keys, and a
# job with no model that pushes her branch), not PHIX_GITHUB_TOKEN back.

name: Flo

on:
  repository_dispatch:
    types: [flo-wake]
  workflow_dispatch:

concurrency:
  group: flo
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  flo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claim the work
        id: claim
        run: |
          node flo/api.mjs claim > flo-work.json
          # This repo's logs are public: print the request numbers, never the owners' words.
          echo "Claimed requests: $(jq -c '[.work[].id]' flo-work.json)"
          echo "n=$(jq '.work | length' flo-work.json)" >> "$GITHUB_OUTPUT"

      - name: Commit as Carrados
        if: steps.claim.outputs.n != '0'
        run: |
          git config --global user.name "Carrados"
          git config --global user.email "200772005+Carrados@users.noreply.github.com"

      # No token that can push or merge: only this run's read-only token.
      - uses: anthropics/claude-code-action@v1
        if: steps.claim.outputs.n != '0'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_name: Carrados
          bot_id: "200772005"
          # Her report would repeat the owner's words in the public run summary.
          display_report: "false"
          prompt: |
            Read flo/FLO.md in this repository and follow it. Your work is in flo-work.json.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node flo/api.mjs step:*),Bash(node flo/api.mjs fabric:*),Bash(node flo/api.mjs stuck:*),Bash(node build.mjs:*),Bash(curl:*),Bash(git:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(diff:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(pwd),Bash(jq:*),Bash(echo:*),Bash(sleep:*),Bash(date:*)"
