# Phix (said "fix"): works on reports from "Fix something on this page".
# Started by the unremarkable Worker at 06:00 and midday UK time, only when there is work
# (fix/phix.js, wake()). It can also be started by hand from the Actions tab. If there is no work, it stops
# before Claude starts, so no tokens are used.
#
# A report is written by a stranger, so the agent who reads it holds no key that can change anything.
# Three jobs, on three machines:
#   phix     the agent. She has her API key, to tell the reporter and the owner what is happening, and
#            nothing else: no Cloudflare key, and no GitHub token that can push or merge. What she finishes
#            she leaves in phix-out/: her branch as a git bundle (report-<id>.bundle) and a hand-in file
#            (ready-<id>.json).
#   build    no model and no keys at all. It builds the pages from her branch (phix/build.mjs). Building runs
#            the site's own build code as she left it, which is why it is kept away from every key.
#   preview  no model. It holds the keys. It checks her branch, pushes it to phix/report-<id>, opens the pull
#            request, uploads a preview copy and calls `ready` (phix/preview.mjs). Nothing from her branch is
#            run. The preview is the Worker as it is on main with the built pages swapped in, and a branch
#            that touches workflows, Worker code or the agents' own files is refused.
#
# This repo is public, and so are its Actions logs. What a visitor reported is never printed here.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN for Claude, from the owner's Claude subscription: run `claude setup-token`
#                           once and paste what it prints. Phix's runs share the subscription's allowance.
#                           For a client, switch to anthropic_api_key with ANTHROPIC_API_KEY (billed per use).
#                           (phix job only)
#   PHIX_SECRET             the same value as the Worker's PHIX_SECRET: Phix's key to /phix/api/
#                           (phix and preview jobs)
#   PHIX_GITHUB_TOKEN       a fine-grained token for Carrados, on the four site repos only:
#                           Contents and Pull requests, read and write. Pushes her branch and opens the
#                           pull request (preview job only). Nothing here merges: the owner's Publish does.
#   CLOUDFLARE_API_TOKEN    to upload preview copies (Workers Scripts: Edit) (preview job only)
#   CLOUDFLARE_ACCOUNT_ID   (preview job only)

name: Phix

on:
  repository_dispatch:
    types: [phix-wake]
  workflow_dispatch:

# One run at a time.
concurrency:
  group: phix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      n: ${{ steps.claim.outputs.n }}
      # Set before the agent starts, so she can't change which reports, or which sites, the later jobs look at.
      work: ${{ steps.claim.outputs.work }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Only the report numbers and their sites are printed: what the visitors wrote stays out of the public log.
      - name: Claim the work
        id: claim
        env:
          PHIX_SECRET: ${{ secrets.PHIX_SECRET }}
        run: |
          node phix/api.mjs claim > phix-work.json
          echo "Claimed reports: $(jq -c '[.work[] | {id, site}]' phix-work.json)"
          echo "n=$(jq '.work | length' phix-work.json)" >> "$GITHUB_OUTPUT"
          echo "work=$(jq -c '[.work[] | {id, site}]' phix-work.json)" >> "$GITHUB_OUTPUT"

      - name: Commit as Carrados
        if: steps.claim.outputs.n != '0'
        run: |
          git config --global user.name "Carrados"
          git config --global user.email "200772005+Carrados@users.noreply.github.com"

      # No Cloudflare key and no token that can push or merge: only this run's read-only token, and her API key.
      # She may call step and stuck; `claim` is done above and `ready` is the preview job's to call.
      - uses: anthropics/claude-code-action@v1
        if: steps.claim.outputs.n != '0'
        env:
          PHIX_SECRET: ${{ secrets.PHIX_SECRET }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          bot_name: Carrados
          bot_id: "200772005"
          # Her report would repeat what visitors wrote in the public run summary.
          display_report: "false"
          prompt: |
            Read phix/PHIX.md in this repository and follow it. Your work is in phix-work.json.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(node phix/api.mjs step:*),Bash(node phix/api.mjs stuck:*),Bash(node build.mjs:*),Bash(npm ci:*),Bash(npm run:*),Bash(npm test:*),Bash(node --test:*),Bash(curl:*),Bash(git:*),Bash(cd:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(find:*),Bash(diff:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*),Bash(pwd),Bash(jq:*),Bash(echo:*),Bash(sleep:*),Bash(date:*)"

      # Her branches and what she understood and changed, for the next two jobs. It says no more than the
      # pull requests will.
      - name: Keep what she handed in
        if: always() && steps.claim.outputs.n != '0'
        uses: actions/upload-artifact@v4
        with:
          name: phix-out
          path: |
            phix-out/ready-*.json
            phix-out/report-*.bundle
          if-no-files-found: ignore
          retention-days: 1

  # A fresh machine with no model and no keys: the only place code from her branch is run.
  build:
    needs: phix
    if: always() && needs.phix.outputs.n != '' && needs.phix.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # main, as this run started on: phix/build.mjs comes from here, never from her branch.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch what she handed in
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phix-out
          path: ${{ runner.temp }}/handin

      - name: Build the pages
        env:
          WORK: ${{ needs.phix.outputs.work }}
          HANDIN_DIR: ${{ runner.temp }}/handin
          OUT_DIR: ${{ runner.temp }}/assets
        run: |
          mkdir -p "$HANDIN_DIR"
          node phix/build.mjs

      - name: Keep the built pages
        uses: actions/upload-artifact@v4
        with:
          name: phix-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: ignore
          retention-days: 1

  # A fresh machine with no model on it: the only place the keys are used.
  preview:
    needs: [phix, build]
    if: always() && needs.phix.outputs.n != '' && needs.phix.outputs.n != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # main, as this run started on: phix/preview.mjs and phix/api.mjs come from here, never from her branch.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch what she handed in
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phix-out
          path: ${{ runner.temp }}/handin

      - name: Fetch the built pages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: phix-assets
          path: ${{ runner.temp }}/assets

      - name: Get wrangler, in a folder of its own
        run: npm install --prefix "$RUNNER_TEMP/tools" --no-save --no-audit --no-fund wrangler@4

      - name: Push her branches, upload the preview copies and hand them in
        env:
          WORK: ${{ needs.phix.outputs.work }}
          HANDIN_DIR: ${{ runner.temp }}/handin
          ASSETS_DIR: ${{ runner.temp }}/assets
          WRANGLER: ${{ runner.temp }}/tools/node_modules/.bin/wrangler
          PUSH_TOKEN: ${{ secrets.PHIX_GITHUB_TOKEN }}
          PHIX_SECRET: ${{ secrets.PHIX_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$HANDIN_DIR" "$ASSETS_DIR"
          node phix/preview.mjs
