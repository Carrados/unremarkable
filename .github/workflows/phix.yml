# Phix (said "fix"): works on reports from "Fix something on this page".
# Started by the unremarkable Worker at 06:00 and midday UK time, only when there is work
# (fix/phix.js, wake()). It can also be started by hand from the Actions tab.
#
# Secrets this needs (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN for Claude, from the owner's Claude subscription: run `claude setup-token`
#                           once and paste what it prints. Phix's runs share the subscription's allowance.
#                           For a client, switch to anthropic_api_key with ANTHROPIC_API_KEY (billed per use).
#   PHIX_SECRET             the same value as the Worker's PHIX_SECRET: Phix's key to /phix/api/
#   PHIX_GITHUB_TOKEN       a fine-grained token for Carrados, on the four site repos only:
#                           Contents and Pull requests, read and write. Phix pushes branches and opens
#                           pull requests; protect main so only a pull request can change it.
#   CLOUDFLARE_API_TOKEN    to upload preview copies (Workers Scripts: Edit)
#   CLOUDFLARE_ACCOUNT_ID

name: Phix

on:
  repository_dispatch:
    types: [phix-wake]
  workflow_dispatch:

# One run at a time.
concurrency:
  group: phix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  phix:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit as Carrados
        run: |
          git config --global user.name "Carrados"
          git config --global user.email "200772005+Carrados@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        env:
          PHIX_SECRET: ${{ secrets.PHIX_SECRET }}
          GH_TOKEN: ${{ secrets.PHIX_GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.PHIX_GITHUB_TOKEN }}
          bot_name: Carrados
          bot_id: "200772005"
          display_report: "true"
          prompt: |
            Read phix/PHIX.md in this repository and follow it. Start by claiming your work.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 200
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(curl:*),Bash(git:*),Bash(gh:*),Bash(node:*),Bash(npm:*),Bash(npx:*),Bash(cd:*),Bash(ls:*)"
